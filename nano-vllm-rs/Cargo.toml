[workspace]
resolver = "2"
members = ["crates/nvllm-models", "crates/nvllm-engine", "crates/snake-gpt2"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.96"

[workspace.dependencies]
candle-core = "0.11"
candle-nn = "0.11"
safetensors = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
